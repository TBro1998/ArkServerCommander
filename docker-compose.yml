services:
  ark-server-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ark-server-manager
    ports:
      - "8080:8080"
    env_file:
      # 可选：从 .env 加载环境变量，文件不存在时忽略（示例见 .env.example）
      - path: .env
        required: false
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    privileged: true

volumes:
  data:
