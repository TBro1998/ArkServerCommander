basePath: /api
definitions:
  auth.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  images.UpdateImageRequest:
    properties:
      image_name:
        example: tbro98/ase-server:latest
        type: string
      restart_running:
        description: 是否立即重启运行中的服务器以应用新镜像
        type: boolean
    required:
    - image_name
    type: object
  models.RuntimeInfo:
    properties:
      copy_source:
        description: copying 阶段的来源服务器名称
        type: string
      cpu_percent:
        description: CPU 占用率，100 表示占满一个核心
        type: number
      max_players:
        description: 查询端口返回的人数上限
        type: integer
      memory_bytes:
        description: 内存占用
        type: integer
      memory_limit:
        description: 内存上限（宿主机内存）
        type: integer
      mod_current:
        description: 正在处理第几个 Mod
        type: integer
      mod_total:
        description: Mod 总数
        type: integer
      phase:
        description: 见 Phase* 常量，无法判断时为空
        type: string
      players:
        description: 在线人数（查询端口返回）
        type: integer
      progress:
        description: 下载服务端时的进度（0-100）
        type: number
      server_name:
        description: 查询端口返回的名称，带游戏版本号
        type: string
      updated_at:
        type: string
    type: object
  models.Schedule:
    properties:
      action:
        type: string
      command:
        description: command 类型要执行的 RCON 命令
        type: string
      created_at:
        type: string
      cron:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      keep:
        description: backup 类型保留的份数，0 表示不清理
        type: integer
      last_result:
        description: 最近一次执行结果，成功为空
        type: string
      last_run_at:
        type: string
      message:
        description: 倒计时广播内容，{minutes} 会被替换为剩余分钟数
        type: string
      next_run_at:
        type: string
      server_id:
        type: integer
      updated_at:
        type: string
      warn_minutes:
        type: integer
    type: object
  models.ScheduleRequest:
    properties:
      action:
        type: string
      command:
        type: string
      cron:
        type: string
      enabled:
        type: boolean
      keep:
        maximum: 1000
        minimum: 0
        type: integer
      message:
        type: string
      warn_minutes:
        maximum: 60
        minimum: 0
        type: integer
    required:
    - action
    - cron
    type: object
  models.ServerArgs:
    properties:
      command_line_args:
        additionalProperties: true
        description: 命令行参数（以-开头的参数）
        type: object
      custom_args:
        description: 自定义参数（用户添加的其他参数）
        items:
          type: string
        type: array
      query_params:
        additionalProperties:
          type: string
        description: 查询参数（以?开头的参数，不包含基础参数）
        type: object
    type: object
  models.ServerArgsRequest:
    properties:
      command_line_args:
        additionalProperties: true
        type: object
      custom_args:
        items:
          type: string
        type: array
      query_params:
        additionalProperties:
          type: string
        type: object
    type: object
  models.ServerRequest:
    properties:
      admin_password:
        type: string
      auto_restart:
        description: 是否自动重启（可选）
        type: boolean
      auto_update:
        description: 每次启动前检查游戏本体和 Mod 更新（可选）
        type: boolean
      cluster_id:
        description: 集群ID
        type: string
      game_ini:
        description: Game.ini 文件内容
        type: string
      game_mod_ids:
        description: 游戏模组ID列表，用逗号分隔
        type: string
      game_user_settings:
        description: 配置文件内容（可选）
        type: string
      identifier:
        type: string
      map:
        type: string
      max_players:
        description: 最大玩家数
        maximum: 200
        minimum: 1
        type: integer
      port:
        maximum: 65535
        minimum: 1
        type: integer
      query_port:
        maximum: 65535
        minimum: 1
        type: integer
      rcon_port:
        maximum: 65535
        minimum: 1
        type: integer
      server_args:
        allOf:
        - $ref: '#/definitions/models.ServerArgsRequest'
        description: 启动参数（可选）
      session_name:
        description: 服务器名称
        type: string
    required:
    - admin_password
    - identifier
    - port
    - query_port
    - rcon_port
    type: object
  models.ServerResponse:
    properties:
      auto_restart:
        type: boolean
      auto_update:
        type: boolean
      cluster_id:
        description: 集群ID
        type: string
      config_pending:
        description: 有已保存但尚未写入数据卷的配置文件修改，下次启动时生效
        type: boolean
      created_at:
        type: string
      game_ini:
        description: Game.ini 文件内容
        type: string
      game_mod_ids:
        type: string
      game_user_settings:
        description: 配置文件内容
        type: string
      generated_args:
        description: 生成的完整启动参数字符串
        type: string
      id:
        type: integer
      identifier:
        type: string
      image_outdated:
        description: 容器仍在使用旧镜像，下次启动时会重建
        type: boolean
      last_error:
        description: 最近一次启停失败的原因
        type: string
      map:
        type: string
      max_players:
        description: 最大玩家数
        type: integer
      port:
        type: integer
      query_port:
        type: integer
      rcon_port:
        type: integer
      runtime:
        allOf:
        - $ref: '#/definitions/models.RuntimeInfo'
        description: 运行中服务器的实时信息（阶段、在线人数、资源占用），由后台监控定期采集
      server_args:
        allOf:
        - $ref: '#/definitions/models.ServerArgs'
        description: 启动参数
      session_name:
        description: 服务器名称
        type: string
      status:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  models.ServerUpdateRequest:
    properties:
      admin_password:
        type: string
      auto_restart:
        type: boolean
      auto_update:
        type: boolean
      cluster_id:
        description: 集群ID，传空字符串表示清空
        type: string
      game_ini:
        description: Game.ini 文件内容
        type: string
      game_mod_ids:
        description: 游戏模组ID列表，用逗号分隔，传空字符串表示清空
        type: string
      game_user_settings:
        description: 配置文件内容（可选）
        type: string
      identifier:
        type: string
      map:
        type: string
      max_players:
        description: 最大玩家数
        maximum: 200
        minimum: 1
        type: integer
      port:
        maximum: 65535
        minimum: 1
        type: integer
      query_port:
        maximum: 65535
        minimum: 1
        type: integer
      rcon_port:
        maximum: 65535
        minimum: 1
        type: integer
      server_args:
        allOf:
        - $ref: '#/definitions/models.ServerArgsRequest'
        description: 启动参数（可选）
      session_name:
        description: 服务器名称
        type: string
    type: object
  models.UserRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  models.UserResponse:
    properties:
      id:
        type: integer
      username:
        type: string
    type: object
  server.BackupInfo:
    properties:
      created_at:
        type: string
      kind:
        type: string
      name:
        type: string
      size:
        type: integer
    type: object
  server.ModInfo:
    properties:
      checked:
        description: 是否从 Steam 拿到了结果；为 false 时表示查询失败（例如无法访问 Steam），Found 无意义
        type: boolean
      file_size:
        type: integer
      found:
        type: boolean
      id:
        type: string
      preview_url:
        type: string
      time_updated:
        type: integer
      title:
        type: string
    type: object
  server.Overview:
    properties:
      cluster_volumes:
        additionalProperties:
          format: int64
          type: integer
        type: object
      cpu_percent:
        type: number
      disk:
        items:
          $ref: '#/definitions/server.ServerDiskUsage'
        type: array
      disk_error:
        type: string
      disk_total:
        type: integer
      disk_updated_at:
        type: string
      memory_bytes:
        type: integer
      online_players:
        type: integer
      public_host:
        type: string
      ready_servers:
        type: integer
      recent_errors:
        items:
          $ref: '#/definitions/server.ServerError'
        type: array
      running_servers:
        type: integer
      total_servers:
        type: integer
    type: object
  server.Player:
    properties:
      index:
        type: integer
      name:
        type: string
      steam_id:
        type: string
    type: object
  server.ServerDiskUsage:
    properties:
      backups:
        description: 备份文件
        type: integer
      data:
        description: 存档和配置（数据卷）
        type: integer
      files:
        description: 服务端文件卷
        type: integer
      plugins:
        description: 插件卷
        type: integer
      server_id:
        type: integer
      session_name:
        type: string
      total:
        type: integer
    type: object
  server.ServerError:
    properties:
      error:
        type: string
      server_id:
        type: integer
      session_name:
        type: string
    type: object
  server.SuggestedPorts:
    properties:
      port:
        type: integer
      query_port:
        type: integer
      rcon_port:
        type: integer
    type: object
  servers.RconCommandRequest:
    properties:
      command:
        type: string
    required:
    - command
    type: object
  servers.UpdateGameRequest:
    properties:
      game:
        type: boolean
      mods:
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API支持
    url: http://www.swagger.io/support
  description: 基于Gin+Gorm的ARK服务器管理系统API文档
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: ARK服务器管理器 API
  version: "1.0"
paths:
  /auth/check-init:
    get:
      consumes:
      - application/json
      description: 检查系统是否已经初始化过用户
      produces:
      - application/json
      responses:
        "200":
          description: 初始化状态
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: 检查系统初始化状态
      tags:
      - 认证
  /auth/login:
    post:
      consumes:
      - application/json
      description: 使用用户名和密码登录系统
      parameters:
      - description: 登录凭据
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/models.UserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求错误
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 认证失败
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 用户登录
      tags:
      - 认证
  /auth/password:
    put:
      consumes:
      - application/json
      description: 校验当前密码后设置新密码（8 到 72 字节）
      parameters:
      - description: 当前密码和新密码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 修改成功
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 请求错误或当前密码错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 修改登录密码
      tags:
      - 用户
  /images/affected:
    get:
      consumes:
      - application/json
      description: 获取使用指定镜像的服务器列表
      parameters:
      - description: 镜像名称
        in: query
        name: image_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 服务器列表
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求错误
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 未授权
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 获取影响的服务器列表
      tags:
      - 镜像管理
  /images/check-updates:
    get:
      consumes:
      - application/json
      description: 检查所有管理的镜像是否有新版本
      produces:
      - application/json
      responses:
        "200":
          description: 镜像更新状态映射
          schema:
            additionalProperties:
              type: boolean
            type: object
        "401":
          description: 未授权
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 检查镜像是否有更新
      tags:
      - 镜像管理
  /images/pull:
    post:
      consumes:
      - application/json
      description: 用户主动触发镜像下载操作
      parameters:
      - description: 镜像信息 {\
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 拉取状态
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求错误
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 未授权
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 手动拉取Docker镜像
      tags:
      - 镜像管理
  /images/status:
    get:
      consumes:
      - application/json
      description: 获取ARK服务器镜像的状态信息（镜像在后台异步拉取）
      produces:
      - application/json
      responses:
        "200":
          description: 镜像状态信息
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未授权
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 获取镜像状态
      tags:
      - 服务器管理
  /images/update:
    post:
      consumes:
      - application/json
      description: 拉取指定镜像的最新版本。已停止的服务器在下次启动时自动用新镜像重建容器；restart_running 为 true 时，运行中的服务器会立即重启以应用新镜像
      parameters:
      - description: 镜像信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/images.UpdateImageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新状态
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求错误
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 未授权
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: 镜像正在下载中
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 更新Docker镜像
      tags:
      - 镜像管理
  /mods:
    get:
      description: 根据 Mod ID 查询名称等信息（Steam 公开接口，结果缓存 6 小时）
      parameters:
      - description: 逗号分隔的 Mod ID
        in: query
        name: ids
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Mod 信息
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/server.ModInfo'
              type: array
            type: object
      security:
      - Bearer: []
      summary: 查询创意工坊 Mod 信息
      tags:
      - 系统
  /profile:
    get:
      consumes:
      - application/json
      description: 获取当前登录用户的基本信息
      produces:
      - application/json
      responses:
        "200":
          description: 用户信息
          schema:
            additionalProperties:
              $ref: '#/definitions/models.UserResponse'
            type: object
        "401":
          description: 未授权
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 获取当前用户信息
      tags:
      - 用户
  /servers:
    get:
      consumes:
      - application/json
      description: 获取当前用户的所有服务器列表
      produces:
      - application/json
      responses:
        "200":
          description: 服务器列表
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/models.ServerResponse'
              type: array
            type: object
        "401":
          description: 未授权
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 获取服务器列表
      tags:
      - 服务器管理
    post:
      consumes:
      - application/json
      description: 创建一个新的ARK服务器配置
      parameters:
      - description: 服务器配置
        in: body
        name: server
        required: true
        schema:
          $ref: '#/definitions/models.ServerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 创建成功
          schema:
            additionalProperties:
              $ref: '#/definitions/models.ServerResponse'
            type: object
        "400":
          description: 请求错误
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 未授权
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 创建新服务器
      tags:
      - 服务器管理
  /servers/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定的服务器配置（仅允许删除已停止的服务器）
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      - description: 同时删除服务器的数据卷和备份
        in: query
        name: delete_data
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 请求错误
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 未授权
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 服务器不存在
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 删除服务器
      tags:
      - 服务器管理
    get:
      consumes:
      - application/json
      description: 根据ID获取指定服务器的详细信息（包括配置文件内容）
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 服务器信息（包含配置文件）
          schema:
            additionalProperties:
              $ref: '#/definitions/models.ServerResponse'
            type: object
        "400":
          description: 请求错误
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 未授权
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 服务器不存在
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 获取服务器详情
      tags:
      - 服务器管理
    put:
      consumes:
      - application/json
      description: 更新指定服务器的配置信息（包括配置文件）
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新的服务器配置（可包含配置文件内容）
        in: body
        name: server
        required: true
        schema:
          $ref: '#/definitions/models.ServerUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            additionalProperties:
              $ref: '#/definitions/models.ServerResponse'
            type: object
        "400":
          description: 请求错误
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 未授权
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 服务器不存在
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 更新服务器配置
      tags:
      - 服务器管理
  /servers/{id}/backups:
    get:
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 备份列表，最新的在前
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/server.BackupInfo'
              type: array
            type: object
      security:
      - Bearer: []
      summary: 存档备份列表
      tags:
      - 存档备份
    post:
      description: 备份数据卷里的存档和配置文件（不含日志）；运行中的服务器会先保存世界
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 备份信息
          schema:
            additionalProperties:
              $ref: '#/definitions/server.BackupInfo'
            type: object
        "409":
          description: 正在备份或启停
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 立即备份存档
      tags:
      - 存档备份
  /servers/{id}/backups/{name}:
    delete:
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      - description: 备份文件名
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 删除备份文件
      tags:
      - 存档备份
    get:
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      - description: 备份文件名
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/gzip
      responses:
        "200":
          description: 备份文件
          schema:
            type: file
        "404":
          description: 备份不存在
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 下载备份文件
      tags:
      - 存档备份
  /servers/{id}/backups/{name}/restore:
    post:
      description: 只能在服务器停止时执行：先自动备份当前存档（pre-restore），再用所选备份覆盖存档和配置文件
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      - description: 备份文件名
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 恢复成功
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 服务器未停止
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 从备份恢复存档
      tags:
      - 存档备份
  /servers/{id}/backups/upload:
    post:
      consumes:
      - multipart/form-data
      description: 上传本系统导出的 .tar.gz 备份（multipart 字段名 file），校验后加入备份列表
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      - description: 备份文件
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 备份信息
          schema:
            additionalProperties:
              $ref: '#/definitions/server.BackupInfo'
            type: object
        "400":
          description: 格式无效
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 上传备份文件
      tags:
      - 存档备份
  /servers/{id}/logs:
    get:
      description: 返回容器最近 tail 行日志（入口脚本、steamcmd 和游戏的标准输出）
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      - description: 行数（默认 500，最多 5000）
        in: query
        name: tail
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 日志行
          schema:
            additionalProperties:
              items:
                type: string
              type: array
            type: object
      security:
      - Bearer: []
      summary: 获取服务器日志
      tags:
      - 服务器管理
  /servers/{id}/logs/stream:
    get:
      description: Server-Sent Events：先发送最近 tail 行，之后持续推送新日志。每条消息的 data 是一行日志；容器停止时发送
        end 事件
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      - description: 先发送的历史行数（默认 200）
        in: query
        name: tail
        type: integer
      produces:
      - text/event-stream
      responses: {}
      security:
      - Bearer: []
      summary: 实时跟随服务器日志
      tags:
      - 服务器管理
  /servers/{id}/players:
    get:
      description: 通过 RCON ListPlayers 获取在线玩家（名称和 SteamID）
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 玩家列表
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/server.Player'
              type: array
            type: object
      security:
      - Bearer: []
      summary: 在线玩家列表
      tags:
      - 服务器管理
  /servers/{id}/rcon:
    get:
      consumes:
      - application/json
      description: 获取指定服务器的RCON连接信息（包括密码）
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: RCON信息
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求错误
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 未授权
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 服务器不存在
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 获取服务器RCON信息
      tags:
      - 服务器管理
  /servers/{id}/rcon/command:
    post:
      consumes:
      - application/json
      description: 在运行中的服务器上执行一条 RCON 命令（如 Broadcast、SaveWorld、KickPlayer），返回输出
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      - description: 命令
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/servers.RconCommandRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 命令输出
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 服务器未运行或命令无效
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 执行 RCON 命令
      tags:
      - 服务器管理
  /servers/{id}/recreate:
    post:
      consumes:
      - application/json
      description: 使用新镜像重建指定服务器的容器
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 重建状态
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 请求错误
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 未授权
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 服务器不存在
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 重建服务器容器
      tags:
      - 服务器管理
  /servers/{id}/restart:
    post:
      description: 运行中的服务器先保存世界并停止，再按当前配置启动；已停止的直接启动。后台执行
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 已开始重启
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 服务器不存在
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: 服务器正在启停
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 重启服务器
      tags:
      - 服务器管理
  /servers/{id}/schedules:
    get:
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 定时任务
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/models.Schedule'
              type: array
            type: object
      security:
      - Bearer: []
      summary: 定时任务列表
      tags:
      - 定时任务
    post:
      consumes:
      - application/json
      description: 'action: restart / backup / update / command / start / stop；cron
        为 5 段表达式，时区为 CONTAINER_TZ'
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      - description: 定时任务
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.ScheduleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 定时任务
          schema:
            additionalProperties:
              $ref: '#/definitions/models.Schedule'
            type: object
      security:
      - Bearer: []
      summary: 新建定时任务
      tags:
      - 定时任务
  /servers/{id}/schedules/{scheduleId}:
    delete:
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      - description: 定时任务ID
        in: path
        name: scheduleId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 删除定时任务
      tags:
      - 定时任务
    put:
      consumes:
      - application/json
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      - description: 定时任务ID
        in: path
        name: scheduleId
        required: true
        type: integer
      - description: 定时任务
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.ScheduleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 定时任务
          schema:
            additionalProperties:
              $ref: '#/definitions/models.Schedule'
            type: object
      security:
      - Bearer: []
      summary: 修改定时任务
      tags:
      - 定时任务
  /servers/{id}/schedules/{scheduleId}/run:
    post:
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      - description: 定时任务ID
        in: path
        name: scheduleId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 已开始执行
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 立即执行一次定时任务
      tags:
      - 定时任务
  /servers/{id}/start:
    post:
      consumes:
      - application/json
      description: 启动指定的ARK服务器
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 启动成功
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 请求错误
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 未授权
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 服务器不存在
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 启动服务器
      tags:
      - 服务器管理
  /servers/{id}/stop:
    post:
      consumes:
      - application/json
      description: 停止指定的ARK服务器
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 停止成功
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 请求错误
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 未授权
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 服务器不存在
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 停止服务器
      tags:
      - 服务器管理
  /servers/{id}/update-game:
    post:
      consumes:
      - application/json
      description: 清除安装标记后启动服务器（运行中的先停止），入口脚本在启动时用 steamcmd 校验更新游戏本体、重新下载 Mod
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/servers.UpdateGameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 已开始更新
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 请求错误
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: 服务器正在启停
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 更新游戏本体和 Mod
      tags:
      - 服务器管理
  /system/info:
    get:
      description: 玩家连接用的公网地址（PUBLIC_HOST 或自动探测）
      produces:
      - application/json
      responses:
        "200":
          description: 系统信息
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 系统信息
      tags:
      - 系统
  /system/overview:
    get:
      description: 服务器数量、运行和可连接数量、在线人数、CPU/内存合计、各服务器磁盘占用、公网地址
      parameters:
      - description: 强制重新计算磁盘占用（较慢）
        in: query
        name: refresh
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: 概览
          schema:
            additionalProperties:
              $ref: '#/definitions/server.Overview'
            type: object
      security:
      - Bearer: []
      summary: 首页概览
      tags:
      - 系统
  /system/suggest-ports:
    get:
      description: 返回第一组与现有服务器不冲突的游戏端口、查询端口和 RCON 端口
      produces:
      - application/json
      responses:
        "200":
          description: 端口
          schema:
            additionalProperties:
              $ref: '#/definitions/server.SuggestedPorts'
            type: object
      security:
      - Bearer: []
      summary: 推荐可用端口
      tags:
      - 系统
securityDefinitions:
  Bearer:
    description: JWT token in the format "Bearer {token}"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
