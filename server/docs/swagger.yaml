      consumes:
      - application/json
      description: 内容必须是合法 JSON。运行中也可以保存，插件重新加载或服务器重启后生效
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      - description: 插件名称
        in: path
        name: name
        required: true
        type: string
      - description: 配置内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/servers.PluginConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 已保存
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 保存插件 config.json
      tags:
      - 插件管理
  /servers/{id}/rcon:
    get:
      consumes:
      - application/json
      description: 获取指定服务器的RCON连接信息（包括密码）
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: RCON信息
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求错误
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 未授权
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 服务器不存在
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 获取服务器RCON信息
      tags:
      - 服务器管理
  /servers/{id}/rcon/command:
    post:
      consumes:
      - application/json
      description: 在运行中的服务器上执行一条 RCON 命令（如 Broadcast、SaveWorld、KickPlayer），返回输出
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      - description: 命令
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/servers.RconCommandRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 命令输出
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 服务器未运行或命令无效
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 执行 RCON 命令
      tags:
      - 服务器管理
  /servers/{id}/recreate:
    post:
      consumes:
      - application/json
      description: 使用新镜像重建指定服务器的容器
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 重建状态
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 请求错误
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 未授权
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 服务器不存在
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 重建服务器容器
      tags:
      - 服务器管理
  /servers/{id}/restart:
    post:
      description: 运行中的服务器先保存世界并停止，再按当前配置启动；已停止的直接启动。后台执行
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 已开始重启
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 服务器不存在
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: 服务器正在启停
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 重启服务器
      tags:
      - 服务器管理
  /servers/{id}/schedules:
    get:
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 定时任务
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/models.Schedule'
              type: array
            type: object
      security:
      - Bearer: []
      summary: 定时任务列表
      tags:
      - 定时任务
    post:
      consumes:
      - application/json
      description: 'action: restart / backup / update / command / start / stop；cron
        为 5 段表达式，时区为 CONTAINER_TZ'
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      - description: 定时任务
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.ScheduleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 定时任务
          schema:
            additionalProperties:
              $ref: '#/definitions/models.Schedule'
            type: object
      security:
      - Bearer: []
      summary: 新建定时任务
      tags:
      - 定时任务
  /servers/{id}/schedules/{scheduleId}:
    delete:
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      - description: 定时任务ID
        in: path
        name: scheduleId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 删除定时任务
      tags:
      - 定时任务
    put:
      consumes:
      - application/json
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      - description: 定时任务ID
        in: path
        name: scheduleId
        required: true
        type: integer
      - description: 定时任务
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.ScheduleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 定时任务
          schema:
            additionalProperties:
              $ref: '#/definitions/models.Schedule'
            type: object
      security:
      - Bearer: []
      summary: 修改定时任务
      tags:
      - 定时任务
  /servers/{id}/schedules/{scheduleId}/run:
    post:
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      - description: 定时任务ID
        in: path
        name: scheduleId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 已开始执行
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 立即执行一次定时任务
      tags:
      - 定时任务
  /servers/{id}/start:
    post:
      consumes:
      - application/json
      description: 启动指定的ARK服务器
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 启动成功
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 请求错误
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 未授权
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 服务器不存在
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 启动服务器
      tags:
      - 服务器管理
  /servers/{id}/stop:
    post:
      consumes:
      - application/json
      description: 停止指定的ARK服务器
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 停止成功
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 请求错误
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 未授权
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 服务器不存在
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 停止服务器
      tags:
      - 服务器管理
  /servers/{id}/update-game:
    post:
      consumes:
      - application/json
      description: 清除安装标记后启动服务器（运行中的先停止），入口脚本在启动时用 steamcmd 校验更新游戏本体、重新下载全部 Mod 或
        mod_ids 指定的 Mod
      parameters:
      - description: 服务器ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/servers.UpdateGameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 已开始更新
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 请求错误
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: 服务器正在启停
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 更新游戏本体和 Mod
      tags:
      - 服务器管理
  /system/clusters/{clusterId}:
    delete:
      description: 删除集群卷 ase-cluster-<id> 和数据目录 clusters/<id>（跨服传送的角色和物品）。仍有服务器设置该集群
        ID，或卷仍被容器挂载时返回 409
      parameters:
      - description: 集群ID
        in: path
        name: clusterId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 已删除
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: 集群仍在使用中
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 删除未使用的集群数据
      tags:
      - 系统
  /system/info:
    get:
      description: 玩家连接用的公网地址（PUBLIC_HOST 或自动探测）
      produces:
      - application/json
      responses:
        "200":
          description: 系统信息
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 系统信息
      tags:
      - 系统
  /system/overview:
    get:
      description: 服务器数量、运行和可连接数量、在线人数、CPU/内存合计、各服务器磁盘占用、公网地址
      parameters:
      - description: 强制重新计算磁盘占用（较慢）
        in: query
        name: refresh
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: 概览
          schema:
            additionalProperties:
              $ref: '#/definitions/server.Overview'
            type: object
      security:
      - Bearer: []
      summary: 首页概览
      tags:
      - 系统
  /system/suggest-ports:
    get:
      description: 返回第一组与现有服务器不冲突的游戏端口、查询端口和 RCON 端口
      produces:
      - application/json
      responses:
        "200":
          description: 端口
          schema:
            additionalProperties:
              $ref: '#/definitions/server.SuggestedPorts'
            type: object
      security:
      - Bearer: []
      summary: 推荐可用端口
      tags:
      - 系统
  /system/version:
    get:
      description: 当前版本和 GitHub 上的最新发布版本（结果缓存 6 小时，查询失败 10 分钟后重试）。当前为开发版本（dev）时 has_update
        始终为 false
      parameters:
      - description: 重新查询最新版本
        in: query
        name: refresh
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: 版本信息
          schema:
            additionalProperties:
              $ref: '#/definitions/server.VersionInfo'
            type: object
      security:
      - Bearer: []
      summary: 版本信息
      tags:
      - 系统
  /tokens:
    get:
      description: 列出当前用户的 MCP 访问令牌（不含令牌明文）
      produces:
      - application/json
      responses:
        "200":
          description: 令牌列表
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/models.APIToken'
              type: array
            type: object
      security:
      - Bearer: []
      summary: 列出 MCP 访问令牌
      tags:
      - 用户
    post:
      consumes:
      - application/json
      description: 生成一个长期有效的令牌，供 Agent 通过 /mcp 调用。响应中的 token 是明文，只返回这一次。read_only
        为 true 时只能调用查询类工具
      parameters:
      - description: 令牌名称和权限
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.APITokenRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 新令牌
          schema:
            additionalProperties:
              $ref: '#/definitions/models.APITokenCreated'
            type: object
        "400":
          description: 请求错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 创建 MCP 访问令牌
      tags:
      - 用户
  /tokens/{id}:
    delete:
      description: 删除令牌，使用它的 Agent 立即失去访问权限
      parameters:
      - description: 令牌ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 已撤销
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 令牌不存在
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 撤销 MCP 访问令牌
      tags:
      - 用户
securityDefinitions:
  Bearer:
    description: JWT token in the format "Bearer {token}"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
