      responses:
        "200":
          description: 已删除
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: 集群仍在使用中
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 删除未使用的集群数据
      tags:
      - 系统
  /system/info:
    get:
      description: 玩家连接用的公网地址（PUBLIC_HOST 或自动探测）
      produces:
      - application/json
      responses:
        "200":
          description: 系统信息
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 系统信息
      tags:
      - 系统
  /system/overview:
    get:
      description: 服务器数量、运行和可连接数量、在线人数、CPU/内存合计、各服务器磁盘占用、公网地址
      parameters:
      - description: 强制重新计算磁盘占用（较慢）
        in: query
        name: refresh
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: 概览
          schema:
            additionalProperties:
              $ref: '#/definitions/server.Overview'
            type: object
      security:
      - Bearer: []
      summary: 首页概览
      tags:
      - 系统
  /system/server-defaults:
    get:
      description: 新建服务器时写入的默认 GameUserSettings.ini、Game.ini 和启动参数，新建页以它为基础编辑
      produces:
      - application/json
      responses:
        "200":
          description: 默认配置
          schema:
            additionalProperties:
              $ref: '#/definitions/server.ServerDefaults'
            type: object
      security:
      - Bearer: []
      summary: 新建服务器的默认配置
      tags:
      - 系统
  /system/suggest-ports:
    get:
      description: 返回第一组与现有服务器不冲突的游戏端口、查询端口和 RCON 端口
      produces:
      - application/json
      responses:
        "200":
          description: 端口
          schema:
            additionalProperties:
              $ref: '#/definitions/server.SuggestedPorts'
            type: object
      security:
      - Bearer: []
      summary: 推荐可用端口
      tags:
      - 系统
  /system/version:
    get:
      description: 当前版本和 GitHub 上的最新发布版本（结果缓存 6 小时，查询失败 10 分钟后重试）。当前为开发版本（dev）时 has_update
        始终为 false
      parameters:
      - description: 重新查询最新版本
        in: query
        name: refresh
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: 版本信息
          schema:
            additionalProperties:
              $ref: '#/definitions/server.VersionInfo'
            type: object
      security:
      - Bearer: []
      summary: 版本信息
      tags:
      - 系统
  /tokens:
    get:
      description: 列出当前用户的 MCP 访问令牌（不含令牌明文）
      produces:
      - application/json
      responses:
        "200":
          description: 令牌列表
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/models.APIToken'
              type: array
            type: object
      security:
      - Bearer: []
      summary: 列出 MCP 访问令牌
      tags:
      - 用户
    post:
      consumes:
      - application/json
      description: 生成一个长期有效的令牌，供 Agent 通过 /mcp 调用。响应中的 token 是明文，只返回这一次。read_only
        为 true 时只能调用查询类工具
      parameters:
      - description: 令牌名称和权限
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.APITokenRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 新令牌
          schema:
            additionalProperties:
              $ref: '#/definitions/models.APITokenCreated'
            type: object
        "400":
          description: 请求错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 创建 MCP 访问令牌
      tags:
      - 用户
  /tokens/{id}:
    delete:
      description: 删除令牌，使用它的 Agent 立即失去访问权限
      parameters:
      - description: 令牌ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 已撤销
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 令牌不存在
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 撤销 MCP 访问令牌
      tags:
      - 用户
securityDefinitions:
  Bearer:
    description: JWT token in the format "Bearer {token}"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
