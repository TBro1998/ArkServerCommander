basePath: /api
definitions:
  auth.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  images.UpdateImageRequest:
    properties:
      image_name:
        example: tbro98/ase-server:latest
        type: string
      restart_running:
        description: 是否立即重启运行中的服务器以应用新镜像
        type: boolean
    required:
    - image_name
    type: object
  models.APIToken:
    properties:
      created_at:
        type: string
      id:
        type: integer
      last_used_at:
        type: string
      name:
        type: string
      prefix:
        description: 令牌开头几位，用于在列表中辨认
        type: string
      read_only:
        description: 只读令牌只能调用查询类工具
        type: boolean
    type: object
  models.APITokenCreated:
    properties:
      created_at:
        type: string
      id:
        type: integer
      last_used_at:
        type: string
      name:
        type: string
      prefix:
        description: 令牌开头几位，用于在列表中辨认
        type: string
      read_only:
        description: 只读令牌只能调用查询类工具
        type: boolean
      token:
        type: string
    type: object
  models.APITokenRequest:
    properties:
      name:
        type: string
      read_only:
        type: boolean
    required:
    - name
    type: object
  models.RuntimeInfo:
    properties:
      copy_source:
        description: copying 阶段的来源服务器名称
        type: string
      cpu_percent:
        description: CPU 占用率，100 表示占满一个核心
        type: number
      image:
        description: pulling_image 阶段正在下载的镜像
        type: string
      max_players:
        description: 查询端口返回的人数上限
        type: integer
      memory_bytes:
        description: 内存占用
        type: integer
      memory_limit:
        description: 内存上限（宿主机内存）
        type: integer
      mod_current:
        description: 正在处理第几个 Mod
        type: integer
      mod_total:
        description: Mod 总数
        type: integer
      phase:
        description: 见 Phase* 常量，无法判断时为空
        type: string
      players:
        description: 在线人数（查询端口返回）
        type: integer
      progress:
        description: 下载服务端时的进度（0-100）
        type: number
      server_name:
        description: 查询端口返回的名称，带游戏版本号
        type: string
      updated_at:
        type: string
    type: object
  models.Schedule:
    properties:
      action:
        type: string
      command:
        description: command 类型要执行的 RCON 命令
        type: string
      created_at:
        type: string
      cron:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      keep:
        description: backup 类型保留的份数，0 表示不清理
        type: integer
      last_result:
        description: 最近一次执行结果，成功为空
        type: string
      last_run_at:
        type: string
      message:
        description: 倒计时广播内容，{minutes} 会被替换为剩余分钟数
        type: string
      next_run_at:
        type: string
      server_id:
        type: integer
      updated_at:
        type: string
      warn_minutes:
        type: integer
    type: object
  models.ScheduleRequest:
    properties:
      action:
        type: string
      command:
        type: string
      cron:
        type: string
      enabled:
        type: boolean
      keep:
        maximum: 1000
        minimum: 0
        type: integer
      message:
        type: string
      warn_minutes:
        maximum: 60
        minimum: 0
        type: integer
    required:
    - action
    - cron
    type: object
  models.ServerArgs:
    properties:
      command_line_args:
        additionalProperties: true
        description: 命令行参数（以-开头的参数）
        type: object
      custom_args:
        description: 自定义参数（用户添加的其他参数）
        items:
          type: string
        type: array
      query_params:
        additionalProperties:
          type: string
        description: 查询参数（以?开头的参数，不包含基础参数）
        type: object
    type: object
  models.ServerArgsRequest:
    properties:
      command_line_args:
        additionalProperties: true
        type: object
      custom_args:
        items:
          type: string
        type: array
      query_params:
        additionalProperties:
          type: string
        type: object
    type: object
  models.ServerRequest:
    properties:
      admin_password:
        type: string
      arkapi:
        description: 启用 ArkApi（Proton 镜像），默认关闭（Linux 镜像）
        type: boolean
      auto_restart:
        description: 是否自动重启（可选）
        type: boolean
      auto_update:
        description: 每次启动前检查游戏本体和 Mod 更新（可选）
        type: boolean
      cluster_id:
        description: 集群ID
        type: string
      game_ini:
        description: Game.ini 文件内容
        type: string
      game_mod_ids:
        description: 游戏模组ID列表，用逗号分隔
        type: string
      game_user_settings:
        description: 配置文件内容（可选）
        type: string
      identifier:
        type: string
      map:
        type: string
      max_players:
        description: 最大玩家数
        maximum: 200
        minimum: 1
        type: integer
      port:
        maximum: 65535
        minimum: 1
        type: integer
      query_port:
        maximum: 65535
        minimum: 1
        type: integer
      rcon_port:
        maximum: 65535
        minimum: 1
        type: integer
      server_args:
        allOf:
        - $ref: '#/definitions/models.ServerArgsRequest'
        description: 启动参数（可选）
      session_name:
        description: 服务器名称
        type: string
    required:
    - admin_password
    - identifier
    - port
    - query_port
    - rcon_port
    type: object
  models.ServerResponse:
    properties:
      arkapi:
        description: 启用 ArkApi（Proton 镜像运行 Windows 版服务端）
        type: boolean
      auto_restart:
        type: boolean
      auto_update:
        type: boolean
      cluster_id:
        description: 集群ID
        type: string
      config_pending:
        description: 有已保存但尚未写入数据卷的配置文件修改，下次启动时生效
        type: boolean
      created_at:
        type: string
      game_ini:
        description: Game.ini 文件内容
        type: string
      game_mod_ids:
        type: string
      game_user_settings:
        description: 配置文件内容
        type: string
      generated_args:
        description: 生成的完整启动参数字符串
        type: string
      id:
        type: integer
      identifier:
        type: string
      image:
        description: 服务器使用的镜像，由 arkapi 决定
        type: string
      image_outdated:
        description: 容器仍在使用旧镜像，下次启动时会重建
        type: boolean
      last_error:
        description: 最近一次启停失败的原因
        type: string
      map:
        type: string
      max_players:
        description: 最大玩家数
        type: integer
      mods_outdated:
        description: 创意工坊上有更新的 Mod ID（更新时间晚于安装时间），由后台定期检查
        items:
          type: string
        type: array
      port:
        type: integer
      query_port:
        type: integer
      rcon_port:
        type: integer
      runtime:
        allOf:
        - $ref: '#/definitions/models.RuntimeInfo'
        description: 运行中服务器的实时信息（阶段、在线人数、资源占用），由后台监控定期采集
      server_args:
        allOf:
        - $ref: '#/definitions/models.ServerArgs'
        description: 启动参数
      session_name:
        description: 服务器名称
        type: string
      status:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  models.ServerUpdateRequest:
    properties:
      admin_password:
        type: string
      arkapi:
        description: 切换后下次启动时重建容器
        type: boolean
      auto_restart:
        type: boolean
      auto_update:
        type: boolean
      cluster_id:
        description: 集群ID，传空字符串表示清空
        type: string
      game_ini:
        description: Game.ini 文件内容
        type: string
      game_mod_ids:
        description: 游戏模组ID列表，用逗号分隔，传空字符串表示清空
        type: string
      game_user_settings:
        description: 配置文件内容（可选）
        type: string
      identifier:
        type: string
      map:
        type: string
      max_players:
        description: 最大玩家数
        maximum: 200
        minimum: 1
        type: integer
      port:
        maximum: 65535
        minimum: 1
        type: integer
      query_port:
        maximum: 65535
        minimum: 1
        type: integer
      rcon_port:
        maximum: 65535
        minimum: 1
        type: integer
      server_args:
        allOf:
        - $ref: '#/definitions/models.ServerArgsRequest'
        description: 启动参数（可选）
      session_name:
        description: 服务器名称
        type: string
    type: object
  models.UserRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  models.UserResponse:
    properties:
      id:
        type: integer
      username:
        type: string
    type: object
  server.ArkApiVersion:
    properties:
      builtin:
        description: 随管理端发布
        type: boolean
      deletable:
        description: 本地文件，可以从版本库删除
        type: boolean
      local:
        description: 已在本地（内置、已下载或上传），安装时不需要联网
        type: boolean
      on_github:
        description: GitHub 上有这个版本
        type: boolean
      published_at:
        description: GitHub 发布时间
        type: string
      release_url:
        description: GitHub 发布页
        type: string
      size:
        description: 本地压缩包大小
        type: integer
      version:
        type: string
    type: object
  server.ArkApiVersions:
    properties:
      checked_at:
        type: string
      github_error:
        description: 查询 GitHub 失败的原因，此时只列出本地版本
        type: string
      latest:
        type: string
      versions:
        description: 从新到旧
        items:
          $ref: '#/definitions/server.ArkApiVersion'
        type: array
    type: object
  server.BackupInfo:
    properties:
      created_at:
        type: string
      kind:
        type: string
      name:
        type: string
      size:
        type: integer
    type: object
  server.GameLog:
    properties:
      exists:
        type: boolean
      lines:
        items:
          type: string
        type: array
      modified_at:
        type: string
      size:
        type: integer
    type: object
  server.ModInfo:
    properties:
      checked:
        description: 是否从 Steam 拿到了结果；为 false 时表示查询失败（例如无法访问 Steam），Found 无意义
        type: boolean
      file_size:
        type: integer
      found:
        type: boolean
      id:
        type: string
      preview_url:
        type: string
      time_updated:
        type: integer
      title:
        type: string
    type: object
  server.Overview:
    properties:
      cluster_volumes:
        additionalProperties:
          format: int64
          type: integer
        type: object
      cpu_percent:
        type: number
      disk:
        items:
          $ref: '#/definitions/server.ServerDiskUsage'
        type: array
      disk_error:
        type: string
      disk_total:
        type: integer
      disk_updated_at:
        type: string
      memory_bytes:
        type: integer
      online_players:
        type: integer
      public_host:
        type: string
      ready_servers:
        type: integer
      recent_errors:
        items:
          $ref: '#/definitions/server.ServerError'
        type: array
      running_servers:
        type: integer
      total_servers:
        type: integer
      unused_clusters:
        description: 没有服务器使用、可以删除的集群数据（删除服务器或改集群 ID 后留下的）
        items:
          $ref: '#/definitions/server.UnusedCluster'
        type: array
    type: object
  server.Player:
    properties:
      index:
        type: integer
      name:
        type: string
      steam_id:
        type: string
    type: object
  server.PluginInfo:
    properties:
      dependencies:
        items:
          type: string
        type: array
      description:
        type: string
      enabled:
        description: false 表示已停用（不在插件卷里）
        type: boolean
      full_name:
        type: string
      has_config:
        type: boolean
      has_dll:
        description: 目录里有 <名称>.dll，没有时 ArkApi 加载会失败
        type: boolean
      min_api_version:
        type: string
      name:
        description: 目录名
        type: string
      size:
        type: integer
      version:
        type: string
    type: object
  server.PluginsOverview:
    properties:
      arkapi_installed:
        description: 服务端文件里有 ArkApi（version.dll）
        type: boolean
      arkapi_version:
        description: 安装时写入的版本号（.arkapi_version），手动放进去的没有
        type: string
      plugins:
        items:
          $ref: '#/definitions/server.PluginInfo'
        type: array
    type: object
  server.ServerDiskUsage:
    properties:
      backups:
        description: 备份文件
        type: integer
      data:
        description: 存档和配置（数据卷）
        type: integer
      files:
        description: 服务端文件卷
        type: integer
      plugins:
        description: 插件卷
        type: integer
      server_id:
        type: integer
      session_name:
        type: string
      total:
        type: integer
    type: object
  server.ServerError:
    properties:
      error:
        type: string
      server_id:
        type: integer
      session_name:
        type: string
    type: object
  server.ServerMod:
    properties:
      checked:
        description: 是否从 Steam 拿到了结果；为 false 时表示查询失败（例如无法访问 Steam），Found 无意义
        type: boolean
      file_size:
        type: integer
      found:
        type: boolean
      has_update:
        description: 创意工坊上的更新时间晚于安装时间
        type: boolean
      id:
        type: string
      installed:
        description: 服务端文件卷里已安装
        type: boolean
      installed_at:
        description: 安装时间（Unix 秒），未知时没有
        type: integer
      preview_url:
        type: string
      time_updated:
        type: integer
      title:
        type: string
    type: object
  server.SuggestedPorts:
    properties:
      port:
        type: integer
      query_port:
        type: integer
      rcon_port:
        type: integer
    type: object
  server.UnusedCluster:
    properties:
      id:
        type: string
      size:
        description: 数据目录 clusters/<id> 的大小，来自磁盘统计缓存
        type: integer
    type: object
  server.VersionInfo:
    properties:
      checked_at:
        type: string
      current:
        type: string
      error:
        description: 查询失败的原因
        type: string
      has_update:
        description: 当前是开发版本（dev）时始终为 false
        type: boolean
      latest:
        description: 最新发布版本（不含预发布），查询失败时为空
        type: string
      published_at:
        description: 最新版本的发布时间
        type: string
      release_url:
        description: 最新版本的发布说明
        type: string
    type: object
  servers.InstallArkApiRequest:
    properties:
      version:
        description: 为空时安装最新版本
        type: string
    type: object
  servers.PluginConfigRequest:
    properties:
      content:
        type: string
    type: object
  servers.RconCommandRequest:
    properties:
      command:
        type: string
    required:
    - command
    type: object
  servers.SetPluginStateRequest:
    properties:
      enabled:
        type: boolean
    type: object
  servers.UpdateGameRequest:
    properties:
      game:
        description: 校验并更新游戏本体
        type: boolean
      mod_ids:
        description: 只重新下载这些 Mod（mods 为 false 时生效）
        items:
          type: string
        type: array
      mods:
        description: 重新下载全部 Mod
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API支持
    url: http://www.swagger.io/support
  description: 基于Gin+Gorm的ARK服务器管理系统API文档
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: ARK服务器管理器 API
  version: "1.0"
paths:
  /arkapi/versions:
    get:
      description: 内置版本、已下载或上传到数据目录 arkapi/ 的版本，以及 GitHub（Michidu/ARK-Server-API）上发布的版本，从新到旧。GitHub
        结果缓存 6 小时，refresh=true 时重新查询
      parameters:
      - description: 重新查询 GitHub
        in: query
        name: refresh
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: 版本列表
          schema:
            additionalProperties:
              $ref: '#/definitions/server.ArkApiVersions'
            type: object
      security:
      - Bearer: []
      summary: ArkApi 版本列表
      tags:
      - 插件管理
    post:
      consumes:
      - multipart/form-data
      description: 上传 ArkApi zip（multipart 字段 file）到版本库，压缩包里要有 version.dll。版本号从文件名（如
        ArkApi_3.56.zip）识别，识别不出时用 version 指定；同版本会被覆盖
      parameters:
      - description: ArkApi zip
        in: formData
        name: file
        required: true
        type: file
      - description: 版本号
        in: formData
        name: version
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 版本号
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 压缩包无效
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 上传 ArkApi
      tags:
      - 插件管理
  /arkapi/versions/{version}:
    delete:
      description: 删除版本库里下载或上传的压缩包，不影响已经安装到服务器的文件；内置版本不能删除
      parameters:
      - description: 版本号
        in: path
        name: version
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 已删除
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 删除 ArkApi 版本
      tags:
      - 插件管理
  /auth/check-init:
    get:
      consumes:
      - application/json
      description: 检查系统是否已经初始化过用户
      produces:
      - application/json
      responses:
        "200":
          description: 初始化状态
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: 检查系统初始化状态
      tags:
      - 认证
  /auth/login:
    post:
      consumes:
      - application/json
      description: 使用用户名和密码登录系统
      parameters:
      - description: 登录凭据
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/models.UserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求错误
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 认证失败
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 用户登录
      tags:
      - 认证
  /auth/password:
    put:
      consumes:
      - application/json
      description: 校验当前密码后设置新密码（8 到 72 字节）
      parameters:
      - description: 当前密码和新密码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 修改成功
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 请求错误或当前密码错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 修改登录密码
      tags:
      - 用户
  /images/affected:
    get:
      consumes:
      - application/json
      description: 获取使用指定镜像的服务器列表
      parameters:
      - description: 镜像名称
        in: query
        name: image_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 服务器列表
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求错误
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 未授权
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 获取影响的服务器列表
      tags:
      - 镜像管理
  /images/check-updates:
    get:
      consumes:
      - application/json
      description: 检查所有管理的镜像是否有新版本
      produces:
      - application/json
      responses:
        "200":
          description: 镜像更新状态映射
          schema:
            additionalProperties:
              type: boolean
            type: object
        "401":
          description: 未授权
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 检查镜像是否有更新
      tags:
      - 镜像管理
