basePath: /api
definitions:
  auth.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  images.UpdateImageRequest:
    properties:
      image_name:
        example: tbro98/ase-server:latest
        type: string
      restart_running:
        description: 是否立即重启运行中的服务器以应用新镜像
        type: boolean
    required:
    - image_name
    type: object
  models.APIToken:
    properties:
      created_at:
        type: string
      id:
        type: integer
      last_used_at:
        type: string
      name:
        type: string
      prefix:
        description: 令牌开头几位，用于在列表中辨认
        type: string
      read_only:
        description: 只读令牌只能调用查询类工具
        type: boolean
    type: object
  models.APITokenCreated:
    properties:
      created_at:
        type: string
      id:
        type: integer
      last_used_at:
        type: string
      name:
        type: string
      prefix:
        description: 令牌开头几位，用于在列表中辨认
        type: string
      read_only:
        description: 只读令牌只能调用查询类工具
        type: boolean
      token:
        type: string
    type: object
  models.APITokenRequest:
    properties:
      name:
        type: string
      read_only:
        type: boolean
    required:
    - name
    type: object
  models.ApplyConfigRequest:
    properties:
      config:
        $ref: '#/definitions/models.ServerConfig'
      parts:
        description: 为空表示全部
        items:
          type: string
        type: array
    required:
    - config
    type: object
  models.ArkfgfAccountInfo:
    properties:
      avatar_url:
        type: string
      bound_at:
        type: string
      commander_id:
        type: integer
      commander_name:
        description: 这个 Commander 在网站上的名称
        type: string
      steam_id:
        type: string
      user_name:
        description: Steam 昵称
        type: string
    type: object
  models.ArkfgfAccountStatus:
    properties:
      account:
        allOf:
        - $ref: '#/definitions/models.ArkfgfAccountInfo'
        description: 已绑定时的账号信息
      bound:
        description: 已绑定账号
        type: boolean
      dashboard_url:
        description: 网站的服主后台
        type: string
      enabled:
        description: ARKFGF_API 不为空
        type: boolean
      login:
        allOf:
        - $ref: '#/definitions/models.ArkfgfLoginStatus'
        description: 进行中的 Steam 登录
    type: object
  models.ArkfgfLoginFinishRequest:
    properties:
      params:
        additionalProperties:
          type: string
        type: object
    required:
    - params
    type: object
  models.ArkfgfLoginRequest:
    properties:
      name:
        description: 这个 Commander 在网站上的名称，为空时用 ArkServerCommander，最多 64 字
        type: string
      return_to:
        description: Steam 登录后回到的 Commander 页面（origin + /settings/arkfgf-callback），不带
          query
        type: string
    type: object
  models.ArkfgfLoginResponse:
    properties:
      steam_url:
        type: string
    type: object
  models.ArkfgfLoginStatus:
    properties:
      error:
        description: 失败原因（中文）
        type: string
      error_code:
        description: 最近一次完成登录失败的错误码（开始新的登录或绑定成功时清除）
        type: string
      expires_at:
        description: 最近一次开始的登录的过期时间
        type: string
      pending:
        description: 有开始了、还没完成也没过期的登录
        type: boolean
    type: object
  models.CopyConfigRequest:
    properties:
      parts:
        description: 为空表示全部
        items:
          type: string
        type: array
      target_ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - target_ids
    type: object
  models.CopyConfigResult:
    properties:
      code:
        type: string
      config_pending:
        description: 目标服务器未停止，配置文件已暂存，下次启动时生效
        type: boolean
      error:
        type: string
      server_id:
        type: integer
      session_name:
        type: string
      success:
        type: boolean
    type: object
  models.LinkBan:
    properties:
      avatar_url:
        type: string
      banned_at:
        description: 网站返回的时间，原样转发
      name:
        type: string
      steam_id:
        type: string
    type: object
  models.LinkKickRequest:
    properties:
      ban:
        description: 同时封禁
        type: boolean
      steam_id:
        description: 玩家的 SteamID64
        type: string
    required:
    - steam_id
    type: object
  models.LinkMember:
    properties:
      avatar_url:
        type: string
      credential_id:
        type: string
      joined_at:
        description: 网站返回的时间，原样转发
      name:
        type: string
      steam_id:
        type: string
    type: object
  models.LinkMembers:
    properties:
      bans:
        items:
          $ref: '#/definitions/models.LinkBan'
        type: array
      members:
        items:
          $ref: '#/definitions/models.LinkMember'
        type: array
    type: object
  models.LinkRoomInfo:
    properties:
      listing:
        allOf:
        - $ref: '#/definitions/models.ListingProfile'
        description: 简介、标签、QQ 群、Discord；全部为空时用第一台服务器的收录资料
      name:
        description: 房间名称，为空时用第一台服务器的名称
        type: string
      servers:
        description: 房间里的服务器（开启了 link 的服务器）
        items:
          $ref: '#/definitions/models.LinkRoomMember'
        type: array
      status:
        allOf:
        - $ref: '#/definitions/models.LinkStatus'
        description: 房间状态；没有服务器开启联机房时为 nil
    type: object
  models.LinkRoomMember:
    properties:
      id:
        type: integer
      online:
        description: 最近一次心跳报告为可以连接
        type: boolean
      port:
        type: integer
      query_port:
        type: integer
      session_name:
        type: string
      status:
        type: string
    type: object
  models.LinkRoomSettings:
    properties:
      listing:
        allOf:
        - $ref: '#/definitions/models.ListingProfile'
        description: 简介、标签、QQ 群、Discord；全部为空时用第一台服务器的收录资料
      name:
        description: 房间名称，为空时用第一台服务器的名称
        type: string
    type: object
  models.LinkStatus:
    properties:
      error:
        description: 错误详情（中文）
        type: string
      error_code:
        description: 网站返回的错误码，或 network / node_error / image_error
        type: string
      retry_at:
        description: 请求失败后下一次重试的时间
        type: string
      room_url:
        description: 网站上的房间页面
        type: string
      state:
        description: 见 Link* 常量
        type: string
    type: object
  models.ListingProfile:
    properties:
      description:
        description: 简介，最多 500 字，可以换行
        type: string
      discord:
        description: Discord 邀请链接（https://discord.gg/...）
        type: string
      qq_group:
        description: QQ 群号
        type: string
      tags:
        description: 标签，最多 8 个，每个最多 16 字
        items:
          type: string
        type: array
    type: object
  models.PublishStatDay:
    properties:
      connects:
        type: integer
      copies:
        type: integer
      day:
        type: string
      views:
        type: integer
    type: object
  models.PublishStatTotals:
    properties:
      connects:
        type: integer
      copies:
        type: integer
      views:
        type: integer
    type: object
  models.PublishStats:
    properties:
      badge:
        type: string
      days:
        items:
          $ref: '#/definitions/models.PublishStatDay'
        type: array
      id:
        type: integer
      month:
        $ref: '#/definitions/models.PublishStatTotals'
      url:
        type: string
      week:
        $ref: '#/definitions/models.PublishStatTotals'
    type: object
  models.PublishStatus:
    properties:
      badge:
        description: 状态徽章图片
        type: string
      error:
        description: 错误详情（中文）
        type: string
      error_code:
        description: 收录站返回的错误码，或 network
        type: string
      published_at:
        description: 最近一次发布或心跳成功的时间
        type: string
      retry_at:
        description: 失败后下一次重试的时间
        type: string
      state:
        description: 见 Publish* 常量
        type: string
      url:
        description: 收录站页面
        type: string
    type: object
  models.Reachability:
    properties:
      checked_at:
        description: 最近一次得出结论的时间
        type: string
      error:
        description: 错误详情（中文）
        type: string
      error_code:
        description: public_ip_unknown
        type: string
      ip:
        description: 检测的 IPv4（PUBLIC_HOST 是域名时为解析结果）
        type: string
      name:
        description: 公网上查询到的服务器名称（mismatch 时用来提示是哪台）
        type: string
      retry_at:
        description: 下一次重试的时间
        type: string
      state:
        description: 见 Reach* 常量
        type: string
    type: object
  models.RuntimeInfo:
    properties:
      copy_source:
        description: copying 阶段的来源服务器名称
        type: string
      cpu_percent:
        description: CPU 占用率，100 表示占满一个核心
        type: number
      image:
        description: pulling_image 阶段正在下载的镜像
        type: string
      max_players:
        description: 查询端口返回的人数上限
        type: integer
      memory_bytes:
        description: 内存占用
        type: integer
      memory_limit:
        description: 内存上限（宿主机内存）
        type: integer
      mod_current:
        description: 正在处理第几个 Mod
        type: integer
      mod_total:
        description: Mod 总数
        type: integer
      phase:
        description: 见 Phase* 常量，无法判断时为空
        type: string
      players:
        description: 在线人数（查询端口返回）
        type: integer
      progress:
        description: 下载服务端时的进度（0-100）
        type: number
      server_name:
        description: 查询端口返回的名称，带游戏版本号
        type: string
      updated_at:
        type: string
    type: object
  models.Schedule:
    properties:
      action:
        type: string
      command:
        description: command 类型要执行的 RCON 命令
        type: string
      created_at:
        type: string
      cron:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      keep:
        description: backup 类型保留的份数，0 表示不清理
        type: integer
      last_result:
        description: 最近一次执行结果，成功为空
        type: string
      last_run_at:
        type: string
      message:
        description: 倒计时广播内容，{minutes} 会被替换为剩余分钟数
        type: string
      next_run_at:
        type: string
      server_id:
        type: integer
      updated_at:
        type: string
      warn_minutes:
        type: integer
    type: object
  models.ScheduleRequest:
    properties:
      action:
        type: string
      command:
        type: string
      cron:
        type: string
      enabled:
        type: boolean
      keep:
        maximum: 1000
        minimum: 0
        type: integer
      message:
        type: string
      warn_minutes:
        maximum: 60
        minimum: 0
        type: integer
    required:
    - action
    - cron
    type: object
  models.ServerArgs:
    properties:
      command_line_args:
        additionalProperties: true
        description: 命令行参数（以-开头的参数）
        type: object
      custom_args:
        description: 自定义参数（用户添加的其他参数）
        items:
          type: string
        type: array
      query_params:
        additionalProperties:
          type: string
        description: 查询参数（以?开头的参数，不包含基础参数）
        type: object
    type: object
  models.ServerArgsRequest:
    properties:
      command_line_args:
        additionalProperties: true
        type: object
      custom_args:
        items:
          type: string
        type: array
      query_params:
        additionalProperties:
          type: string
        type: object
    type: object
  models.ServerConfig:
    properties:
      arkapi:
        type: boolean
      auto_restart:
        type: boolean
      auto_update:
        type: boolean
      cluster_id:
        type: string
      exported_at:
        type: string
      format:
        type: string
      game_ini:
        type: string
      game_mod_ids:
        type: string
      game_user_settings:
        description: 配置文件内容
        type: string
      map:
        type: string
      max_players:
        type: integer
      server_args:
        allOf:
        - $ref: '#/definitions/models.ServerArgs'
        description: 启动参数
      session_name:
        description: 来源服务器的名称，只用于显示，不会导入
        type: string
      version:
        type: integer
    type: object
  models.ServerRequest:
    properties:
      admin_password:
        type: string
      arkapi:
        description: 启用 ArkApi（Proton 镜像），默认关闭（Linux 镜像）
        type: boolean
      auto_restart:
        description: 是否自动重启（可选）
        type: boolean
      auto_update:
        description: 每次启动前检查游戏本体和 Mod 更新（可选）
        type: boolean
      cluster_id:
        description: 集群ID
        type: string
      game_branch:
        description: 游戏版本：空为蜗牛海洋正式版，preaquatica 为通配符原版
        type: string
      game_ini:
        description: Game.ini 文件内容
        type: string
      game_mod_ids:
        description: 游戏模组ID列表，用逗号分隔
        type: string
      game_user_settings:
        description: 配置文件内容（可选）
        type: string
      link:
        description: P2P 联机房，默认关闭
        type: boolean
      listing:
        allOf:
        - $ref: '#/definitions/models.ListingProfile'
        description: 收录资料（可选）
      map:
        type: string
      max_players:
        description: 最大玩家数
        maximum: 200
        minimum: 1
        type: integer
      port:
        maximum: 65535
        minimum: 1
        type: integer
      publish:
        description: 发布到服务器收录站，默认关闭
        type: boolean
      query_port:
        maximum: 65535
        minimum: 1
        type: integer
      rcon_port:
        maximum: 65535
        minimum: 1
        type: integer
      server_args:
        allOf:
        - $ref: '#/definitions/models.ServerArgsRequest'
        description: 启动参数（可选）
      session_name:
        description: 服务器名称
        type: string
    required:
    - admin_password
    - port
    - query_port
    - rcon_port
    type: object
  models.ServerResponse:
    properties:
      arkapi:
        description: 启用 ArkApi（Proton 镜像运行 Windows 版服务端）
        type: boolean
      auto_restart:
        type: boolean
      auto_update:
        type: boolean
      cluster_id:
        description: 集群ID
        type: string
      config_pending:
        description: 有已保存但尚未写入数据卷的配置文件修改，下次启动时生效
        type: boolean
      created_at:
        type: string
      game_branch:
        description: 游戏版本：空为蜗牛海洋正式版，preaquatica 为通配符原版
        type: string
      game_ini:
        description: Game.ini 文件内容
        type: string
      game_mod_ids:
        type: string
      game_user_settings:
        description: 配置文件内容
        type: string
      generated_args:
        description: 生成的完整启动参数字符串
        type: string
      id:
        type: integer
      image:
        description: 服务器使用的镜像，由 arkapi 决定
        type: string
      image_outdated:
        description: 容器仍在使用旧镜像，下次启动时会重建
        type: boolean
      last_error:
        description: 最近一次启停失败的原因
        type: string
      link:
        description: P2P 联机房
        type: boolean
      link_status:
        allOf:
        - $ref: '#/definitions/models.LinkStatus'
        description: 联机房状态，未开启联机房时为空
      listing:
        allOf:
        - $ref: '#/definitions/models.ListingProfile'
        description: 收录资料：简介、标签、QQ 群、Discord
      map:
        type: string
      max_players:
        description: 最大玩家数
        type: integer
      mods_outdated:
        description: 创意工坊上有更新的 Mod ID（更新时间晚于安装时间），由后台定期检查
        items:
          type: string
        type: array
      port:
        type: integer
      publish:
        description: 发布到服务器收录站
        type: boolean
      publish_status:
        allOf:
        - $ref: '#/definitions/models.PublishStatus'
        description: 发布状态，未开启发布时为空
      query_port:
        type: integer
      rcon_port:
        type: integer
      reachability:
        allOf:
        - $ref: '#/definitions/models.Reachability'
        description: 公网可达性：管理端用公网地址查询这台服务器的查询端口的结果。未运行时为空
      runtime:
        allOf:
        - $ref: '#/definitions/models.RuntimeInfo'
        description: 运行中服务器的实时信息（阶段、在线人数、资源占用），由后台监控定期采集
      server_args:
        allOf:
        - $ref: '#/definitions/models.ServerArgs'
        description: 启动参数
      session_name:
        description: 服务器名称
        type: string
      status:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  models.ServerUpdateRequest:
    properties:
      admin_password:
        type: string
      arkapi:
        description: 切换后下次启动时重建容器
        type: boolean
      auto_restart:
        type: boolean
      auto_update:
        type: boolean
      cluster_id:
        description: 集群ID，传空字符串表示清空
        type: string
      game_branch:
        description: 游戏版本，传空字符串表示蜗牛海洋正式版；切换后下次启动时重新校验服务端文件，只下载差异
        type: string
      game_ini:
        description: Game.ini 文件内容
        type: string
      game_mod_ids:
        description: 游戏模组ID列表，用逗号分隔，传空字符串表示清空
        type: string
      game_user_settings:
        description: 配置文件内容（可选）
        type: string
      link:
        description: P2P 联机房，立即生效
        type: boolean
      listing:
        allOf:
        - $ref: '#/definitions/models.ListingProfile'
        description: 收录资料，传了就整体替换；运行中的服务器会重新发布
      map:
        type: string
      max_players:
        description: 最大玩家数
        maximum: 200
        minimum: 1
        type: integer
      port:
        maximum: 65535
        minimum: 1
        type: integer
      publish:
        description: 发布到服务器收录站
        type: boolean
      query_port:
        maximum: 65535
        minimum: 1
        type: integer
      rcon_port:
        maximum: 65535
        minimum: 1
        type: integer
      server_args:
        allOf:
        - $ref: '#/definitions/models.ServerArgsRequest'
        description: 启动参数（可选）
      session_name:
        description: 服务器名称
        type: string
    type: object
  models.UserRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  models.UserResponse:
    properties:
      id:
        type: integer
      username:
        type: string
    type: object
  server.ArkApiVersion:
    properties:
      builtin:
        description: 随管理端发布
        type: boolean
      deletable:
        description: 本地文件，可以从版本库删除
        type: boolean
      local:
        description: 已在本地（内置、已下载或上传），安装时不需要联网
        type: boolean
      on_catalog:
        description: arkfgf.com 插件目录（ark-server-api.com）里有这个版本
        type: boolean
      on_github:
        description: GitHub 上有这个版本
        type: boolean
      published_at:
        description: GitHub 发布时间
        type: string
      release_url:
        description: GitHub 发布页
        type: string
      size:
        description: 本地压缩包大小
        type: integer
      version:
        type: string
    type: object
  server.ArkApiVersions:
    properties:
      checked_at:
        type: string
      github_error:
        description: 查询 GitHub 失败的原因，此时只列出本地版本
        type: string
      latest:
        type: string
      versions:
        description: 从新到旧
        items:
          $ref: '#/definitions/server.ArkApiVersion'
        type: array
    type: object
  server.BackupInfo:
    properties:
      created_at:
        type: string
      kind:
        type: string
      name:
        type: string
      size:
        type: integer
    type: object
  server.CatalogArkApi:
    properties:
      download_url:
        type: string
      file_name:
        type: string
      page_url:
        type: string
      updated_at:
        type: string
      version:
        type: string
    type: object
  server.CatalogPlugin:
    properties:
      author:
        type: string
      category:
        description: official / free / paid
        type: string
      download_url:
        description: 为空表示不能一键安装（付费、需要到网站下载）
        type: string
      downloads:
        type: integer
      file_name:
        type: string
      file_size:
        type: integer
      id:
        type: integer
      page_url:
        type: string
      plugins:
        items:
          $ref: '#/definitions/server.CatalogPluginInfo'
        type: array
      rating:
