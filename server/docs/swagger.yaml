host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API支持
    url: http://www.swagger.io/support
  description: 基于Gin+Gorm的ARK服务器管理系统API文档
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: ARK服务器管理器 API
  version: "1.0"
paths:
  /arkapi/versions:
    get:
      description: 内置版本、已下载或上传到数据目录 arkapi/ 的版本，以及 GitHub（Michidu/ARK-Server-API）上发布的版本，从新到旧。GitHub
        结果缓存 6 小时，refresh=true 时重新查询
      parameters:
      - description: 重新查询 GitHub
        in: query
        name: refresh
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: 版本列表
          schema:
            additionalProperties:
              $ref: '#/definitions/server.ArkApiVersions'
            type: object
      security:
      - Bearer: []
      summary: ArkApi 版本列表
      tags:
      - 插件管理
    post:
      consumes:
      - multipart/form-data
      description: 上传 ArkApi zip（multipart 字段 file）到版本库，压缩包里要有 version.dll。版本号从文件名（如
        ArkApi_3.56.zip）识别，识别不出时用 version 指定；同版本会被覆盖
      parameters:
      - description: ArkApi zip
        in: formData
        name: file
        required: true
        type: file
      - description: 版本号
        in: formData
        name: version
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 版本号
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 压缩包无效
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 上传 ArkApi
      tags:
      - 插件管理
  /arkapi/versions/{version}:
    delete:
      description: 删除版本库里下载或上传的压缩包，不影响已经安装到服务器的文件；内置版本不能删除
      parameters:
      - description: 版本号
        in: path
        name: version
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 已删除
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 删除 ArkApi 版本
      tags:
      - 插件管理
  /arkfgf/account:
    delete:
      description: 调用网站的 DELETE /commander/me（删除这个 Commander 发布的服务器和联机房），成功后清空本地账号和本地的发布、联机房登记（房间资料保留）。连不上网站时返回
        502，force=true 时只清本地（网站上的记录由服主在服主后台移除）
      parameters:
      - description: 连不上网站时也清除本地
        in: query
        name: force
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: 已解除绑定
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 网站拒绝
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: 无法连接 arkfgf.com
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 解除 arkfgf.com 账号绑定
      tags:
      - arkfgf.com 账号
    get:
      description: 是否启用（ARKFGF_API 不为空）、是否已绑定、账号信息（Steam 昵称和头像、Commander 在网站上的名称，不含令牌）、服主后台地址，以及进行中的
        Steam 登录（login：是否在等待、过期时间、最近一次完成登录失败的原因）。refresh=true 且已绑定时先向网站查询最新的账号信息，网站返回账号无效时视为已解绑
      parameters:
      - description: 向网站查询最新的账号信息
        in: query
        name: refresh
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: 账号状态
          schema:
            additionalProperties:
              $ref: '#/definitions/models.ArkfgfAccountStatus'
            type: object
      security:
      - Bearer: []
      summary: arkfgf.com 账号
      tags:
      - arkfgf.com 账号
  /arkfgf/account/login:
    post:
      consumes:
      - application/json
      description: 转给网站的 POST /commander/login，返回 Steam 登录地址，记下其中的 state（10 分钟有效，最多同时
        5 个）。前端用 steam://openurl/ 在 Steam 客户端里打开它（或在浏览器里跳转）；登录后 Steam 跳回 return_to（Commander
        的 /arkfgf-callback 页面），由该页面调用 /arkfgf/account/login/finish 完成绑定
      parameters:
      - description: Commander 名称和回调地址
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ArkfgfLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Steam 登录地址
          schema:
            additionalProperties:
              $ref: '#/definitions/models.ArkfgfLoginResponse'
            type: object
        "400":
          description: 名称或回调地址无效，或网站拒绝
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: 已经绑定，或 ARKFGF_API 为空
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: 无法连接 arkfgf.com
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 用 Steam 登录绑定 arkfgf.com 账号
      tags:
      - arkfgf.com 账号
  /arkfgf/account/login/finish:
    post:
      consumes:
      - application/json
      description: 不需要登录：回调页可能在 Steam 客户端的内置浏览器里打开，那里没有管理端的登录 cookie。只接受本机 /arkfgf/account/login
        开始的、10 分钟内没用过的 state（用一次就删），否则 400 expired_login 且不联系网站。通过后把 Steam 跳回回调页时
        URL 上的全部 query 参数（state、openid.*）转给网站的 POST /commander/login/finish，网站核验通过后保存账号令牌，发布和联机房马上开始。失败：expired_login（过期或已用过）、login_cancelled（在
        Steam 取消）、steam_verify_failed（核验失败）为 400，too_many_commanders（账号绑定数已满）为 409；失败原因也会出现在
        GET /arkfgf/account 的 login 里
      parameters:
      - description: 回调参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ArkfgfLoginFinishRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 已绑定
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 登录过期、取消或核验失败
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: 已经绑定、账号绑定数已满，或 ARKFGF_API 为空
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: 无法连接 arkfgf.com
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 完成 Steam 登录绑定（公开）
      tags:
      - arkfgf.com 账号
  /auth/check-init:
    get:
      consumes:
      - application/json
      description: 检查系统是否已经初始化过用户
      produces:
      - application/json
      responses:
        "200":
          description: 初始化状态
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: 检查系统初始化状态
      tags:
      - 认证
  /auth/login:
    post:
      consumes:
      - application/json
      description: 使用用户名和密码登录系统
      parameters:
      - description: 登录凭据
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/models.UserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求错误
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 认证失败
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 用户登录
      tags:
      - 认证
  /auth/password:
    put:
      consumes:
      - application/json
      description: 校验当前密码后设置新密码（8 到 72 字节）
      parameters:
      - description: 当前密码和新密码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 修改成功
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 请求错误或当前密码错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 修改登录密码
      tags:
      - 用户
  /images/affected:
    get:
      consumes:
      - application/json
      description: 获取使用指定镜像的服务器列表
      parameters:
      - description: 镜像名称
        in: query
        name: image_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 服务器列表
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求错误
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 未授权
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 获取影响的服务器列表
      tags:
      - 镜像管理
  /images/check-updates:
    get:
      consumes:
      - application/json
      description: 检查所有管理的镜像是否有新版本
      produces:
      - application/json
      responses:
        "200":
          description: 镜像更新状态映射
          schema:
            additionalProperties:
              type: boolean
            type: object
        "401":
          description: 未授权
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 检查镜像是否有更新
      tags:
      - 镜像管理
  /images/pull:
    post:
      consumes:
      - application/json
      description: 用户主动触发镜像下载操作
      parameters:
      - description: 镜像信息 {\
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 拉取状态
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求错误
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 未授权
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 手动拉取Docker镜像
      tags:
      - 镜像管理
  /images/status:
    get:
      consumes:
      - application/json
      description: 获取ARK服务器镜像的状态信息（镜像在后台异步拉取）
      produces:
      - application/json
      responses:
        "200":
          description: 镜像状态信息
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未授权
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 获取镜像状态
      tags:
      - 服务器管理
  /images/update:
    post:
      consumes:
      - application/json
      description: 拉取指定镜像的最新版本。已停止的服务器在下次启动时自动用新镜像重建容器；restart_running 为 true 时，运行中的服务器会立即重启以应用新镜像
      parameters:
      - description: 镜像信息
        in: body
        name: request
        required: true
