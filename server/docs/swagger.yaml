          $ref: '#/definitions/images.UpdateImageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新状态
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求错误
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 未授权
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: 镜像正在下载中
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 更新Docker镜像
      tags:
      - 镜像管理
  /link/bans/{steam_id}:
    delete:
      description: 代理 arkfgf.com 的 DELETE /link/rooms/:id/bans/:steam_id
      parameters:
