name: Build and Push Docker Image

on:
  push:
    tags: [ 'v*' ]

env:
  REGISTRY: tbro98
  IMAGE_NAME: arkservercommander

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ env.REGISTRY }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=raw,value=latest

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Note: Artifact attestation is primarily designed for GitHub Container Registry
    # For Docker Hub, this step is optional and may cause authentication issues
    # Uncomment the following lines if you want to enable attestation for GHCR
    # - name: Generate artifact attestation
    #   uses: actions/attest-build-provenance@v4
    #   with:
    #     subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
    #     subject-digest: ${{ steps.build.outputs.digest }}
    #     push-to-registry: true

  # 镜像推送成功后再发布 Release，保证 Release 里写的 tag 一定有对应的镜像
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        name: ${{ github.ref_name }}
        # 由 GitHub 根据上一个 Release 到本 tag 之间的合并 PR 生成 "What's Changed"
        # 末尾会自动附上 Full Changelog 的 compare 链接
        generate_release_notes: true
        # v0.0.2-b1 这类带后缀的当作预发布，不出现在 /releases/latest 里
        prerelease: ${{ contains(github.ref_name, '-') }}
        body: |
          ## 镜像

          ```
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.version }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ```

          digest: `${{ needs.build.outputs.digest }}`
