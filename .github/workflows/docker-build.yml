name: Build and Push Docker Image

on:
  push:
    tags: [ 'v*' ]

env:
  REGISTRY: tbro98
  IMAGE_NAME: arkservercommander

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ env.REGISTRY }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=raw,value=latest

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Note: Artifact attestation is primarily designed for GitHub Container Registry
    # For Docker Hub, this step is optional and may cause authentication issues
    # Uncomment the following lines if you want to enable attestation for GHCR
    # - name: Generate artifact attestation
    #   uses: actions/attest-build-provenance@v4
    #   with:
    #     subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
    #     subject-digest: ${{ steps.build.outputs.digest }}
    #     push-to-registry: true

  # 镜像推送成功后再发布 Release，保证 Release 里写的 tag 一定有对应的镜像
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # 更新说明写在附注 tag 的正文里（第一行是概括，空一行后是 Markdown 正文），见 .claude/skills/release
    - name: Prepare release notes
      env:
        TAG: ${{ github.ref_name }}
        IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        VERSION: ${{ needs.build.outputs.version }}
        DIGEST: ${{ needs.build.outputs.digest }}
      run: |
        # actions/checkout 只把 tag 指向的提交取下来，附注 tag 对象会丢失，单独取一次
        git fetch --force --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
        : > release-notes.md
        if [ "$(git cat-file -t "$TAG")" = tag ]; then
          git tag -l --format='%(contents:body)' "$TAG" > release-notes.md
        fi
        if [ -s release-notes.md ]; then
          echo >> release-notes.md
        fi
        {
          echo '## 镜像'
          echo
          echo '```'
          echo "${IMAGE}:${VERSION}"
          echo "${IMAGE}:latest"
          echo '```'
          echo
          echo "digest: \`${DIGEST}\`"
        } >> release-notes.md
        cat release-notes.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        name: ${{ github.ref_name }}
        # 仓库直接提交到 main，没有 PR 可汇总，这里主要是为了末尾的 Full Changelog compare 链接
        generate_release_notes: true
        # v0.0.2-b1 这类带后缀的当作预发布，不出现在 /releases/latest 里
        prerelease: ${{ contains(github.ref_name, '-') }}
        body_path: release-notes.md
