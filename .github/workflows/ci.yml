name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # 前端检查：lint、类型检查、构建
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ui

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '26'
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npx tsc --noEmit

    - name: Build frontend
      run: npm run build

    - name: Check build output
      run: |
        if [ ! -d ".next" ]; then
          echo "❌ 前端构建失败：.next 目录不存在"
          ls -la
          exit 1
        fi
        echo "✅ 前端构建成功"

  # 后端检查：格式、静态分析、构建、测试
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'
        cache-dependency-path: server/go.sum

    - name: Install dependencies
      run: go mod download

    # -diff 在依赖与 go.mod/go.sum 不一致时返回非零，比 go mod tidy 后检查 git diff 更直接
    - name: Verify go.mod is tidy
      run: go mod tidy -diff

    - name: Run gofmt
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "❌ 以下文件未格式化，请运行 gofmt -w ."
          echo "$unformatted"
          exit 1
        fi
        echo "✅ 代码格式正确"

    - name: Run go vet
      run: go vet ./...

    - name: Build backend
      run: CGO_ENABLED=0 go build -v ./...

    - name: Run tests
      run: go test -v ./...
